on:
  workflow_dispatch:
  push:
    tags:
      # Only clean semver tags — excludes accidental prereleases like
      # 0.8.1-refs-tags-0-8-0.0 created when github-tag-action re-ran on a tag push.
      - "[0-9]+.[0-9]+.[0-9]+"
name: release
permissions:
  contents: write
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 25.x
          registry-url: https://npm.pkg.github.com
          scope: "@sv0"
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: release
        run: npm run release
      - name: create github release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
  notify:
    if: always()
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: sarisia/actions-status-discord@v1
        with:
          status: ${{ needs.build.result }}
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
