<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Apply the persisted theme synchronously, before hydration, so the
      // page never flashes the wrong theme while the JS bundle loads.
      (function () {
        try {
          var saved = localStorage.getItem("theme-preference");
          if (saved === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          // localStorage may be unavailable (e.g. privacy mode); fall back
          // to the SSR default (light).
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
